spring.application.name=Wallet

# Persistent H2 database stored in ./data (survives restarts). No Docker, no external DB needed.
spring.datasource.url=jdbc:h2:file:./data/walletdb;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

